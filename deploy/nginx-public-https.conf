server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name 62.234.13.10;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/puzarchive-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://62.234.13.10$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 62.234.13.10;

    ssl_certificate /etc/letsencrypt/live/62.234.13.10/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/62.234.13.10/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=86400" always;

    location / {
        if ($host != "62.234.13.10") { return 444; }
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 128k;
    }
}
