<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>PuzArchive · Puzzle database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-auth-state="checking">
    <div class="auth-loading" role="status">正在确认成员会话…</div>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#calendar" aria-label="PuzArchive 日历">
          <span class="brand-mark">PA</span>
          <span><strong>PuzArchive</strong><small>puzzle database</small></span>
        </a>
        <nav class="primary-nav">
          <p class="nav-label">PUZZLE ARCHIVE</p>
          <a class="nav-item" data-route-link="calendar" href="#calendar"><span class="nav-icon">▦</span><span>待审核区</span></a>
          <a class="nav-item" data-route-link="pending" href="#pending"><span class="nav-icon">◷</span><span>未完成谜题</span></a>
          <a class="nav-item" data-route-link="leftovers" href="#leftovers"><span class="nav-icon">↻</span><span>leftover 区</span></a>
          <a class="nav-item" data-route-link="allocation" href="#allocation"><span class="nav-icon">◫</span><span>待分配区</span></a>
          <a class="nav-item" data-route-link="finished" href="#finished"><span class="nav-icon">▦</span><span>完成区</span></a>
          <a class="nav-item" data-route-link="messages" href="#messages"><span class="nav-icon">✉</span><span>收件箱</span></a>
          <a class="nav-item" data-route-link="rules" href="#rules"><span class="nav-icon">≡</span><span>规则管理</span></a>
        </nav>
        <div class="sidebar-bottom">
          <div class="sync-status"><span class="status-light"></span><span id="syncStatusText">等待登录</span><span class="mono">v0.3</span></div>
          <button class="profile-chip" type="button" id="profileButton"><span class="avatar avatar-amber">?</span><span class="profile-copy"><strong>访客</strong><small>未登录</small></span><span class="profile-more">···</span></button>
        </div>
      </aside>

      <main class="main-content" id="top">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-separator">/</span><strong id="breadcrumbCurrent">首页</strong></div>
          <div class="top-actions"><button class="inbox-button" type="button" id="inboxButton" aria-label="收件箱，0 条未读" title="收件箱"><span aria-hidden="true">✉</span><b id="inboxUnreadBadge" hidden>0</b></button><button class="login-button" type="button" id="loginButton">退出 <span>↗</span></button></div>
        </header>
        <div id="app" class="page-wrap"></div>
      </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close icon-button" type="button" aria-label="关闭" title="关闭">×</button>
        <div id="modalContent"></div>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
