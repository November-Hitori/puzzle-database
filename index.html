<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>PuzArchive · Puzzle database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-auth-state="checking">
    <div class="auth-loading" role="status">正在确认成员会话…</div>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#calendar" aria-label="PuzArchive 日历">
          <span class="brand-mark">PA</span>
          <span><strong>PuzArchive</strong><small>puzzle database</small></span>
        </a>
        <nav class="primary-nav">
          <p class="nav-label">PUZZLE ARCHIVE</p>
          <a class="nav-item" data-route-link="calendar" href="#calendar" aria-label="待审核区" title="待审核区"><span class="nav-icon" aria-hidden="true">▦</span><span>待审核区</span><span class="nav-count" data-calendar-count="review">—</span></a>
          <a class="nav-item" data-route-link="pending" href="#pending" aria-label="未完成谜题" title="未完成谜题"><span class="nav-icon" aria-hidden="true">◷</span><span>未完成谜题</span></a>
          <a class="nav-item" data-route-link="leftovers" href="#leftovers" aria-label="leftover 区" title="leftover 区"><span class="nav-icon" aria-hidden="true">↻</span><span>leftover 区</span><span class="nav-count" data-calendar-count="leftover">—</span></a>
          <a class="nav-item" data-route-link="allocation" href="#allocation" aria-label="待分配区" title="待分配区"><span class="nav-icon" aria-hidden="true">◫</span><span>待分配区</span><span class="nav-count" data-calendar-count="allocation">—</span></a>
          <a class="nav-item" data-route-link="finished" href="#finished" aria-label="完成区" title="完成区"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18M8 15h1M15 15h1M8 18h1M15 18h1"></path></svg></span><span>完成区</span><span class="nav-count" data-calendar-count="finished">—</span></a>
          <a class="nav-item" data-route-link="messages" href="#messages" aria-label="收件箱" title="收件箱"><span class="nav-icon" aria-hidden="true">✉</span><span>收件箱</span></a>
          <a class="nav-item" data-route-link="rules" href="#rules" aria-label="规则管理" title="规则管理"><span class="nav-icon" aria-hidden="true">≡</span><span>规则管理</span></a>
        </nav>
        <div class="sidebar-bottom">
          <div class="sync-status"><span class="status-light"></span><span id="syncStatusText">等待登录</span><span class="mono">v0.3</span></div>
          <div class="sidebar-account-row">
            <div class="profile-chip" id="profileButton"><span class="avatar avatar-amber">?</span><span class="profile-copy"><strong>访客</strong><small>成员账号</small></span></div>
            <div class="sidebar-account-actions">
              <button class="inbox-button" type="button" id="inboxButton" aria-label="收件箱，0 条未读" title="收件箱"><span aria-hidden="true">✉</span><b id="inboxUnreadBadge" hidden>0</b></button>
              <button class="account-menu-button" type="button" id="accountMenuButton" aria-label="账号菜单" title="账号菜单" aria-haspopup="menu" aria-expanded="false" aria-controls="accountMenu"><span aria-hidden="true">···</span></button>
            </div>
          </div>
        </div>
      </aside>

      <main class="main-content" id="top">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-separator">/</span><strong id="breadcrumbCurrent">首页</strong></div>
        </header>
        <div id="app" class="page-wrap"></div>
      </main>
    </div>

    <div class="account-menu" id="accountMenu" role="menu" aria-labelledby="accountMenuButton" hidden>
      <button class="account-menu-item" type="button" id="changeUsernameButton" role="menuitem">修改用户名</button>
      <button class="account-menu-item" type="button" id="loginButton" role="menuitem">退出</button>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close icon-button" type="button" aria-label="关闭" title="关闭">×</button>
        <div id="modalContent"></div>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
