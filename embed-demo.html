<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>PuzArchive 页内解题 Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="embed-demo-body">
    <main class="embed-demo-page">
      <header class="embed-demo-header">
        <p class="eyebrow"><span class="eyebrow-line"></span>IN-PAGE SOLVER + OPEN LINKS</p>
        <h1>页内解题 + 多工具按钮<span class="heading-period">.</span></h1>
        <p>复刻 Puzsq 178751：题目在页面内直接加载，同时提供 puzz.link、pzplus、pzprxs 等新标签页按钮。</p>
      </header>

      <form class="embed-demo-form" id="embedDemoForm">
        <label>
          <span>待测试的题目 URL</span>
          <input id="embedDemoUrl" type="url" value="https://puzz.link/p?mannequin/6/6/6enfpho6m1eel2h" />
        </label>
        <button class="button button-dark" type="submit">加载页内模块</button>
      </form>

      <div class="embed-demo-cases" aria-label="测试用例">
        <button class="button button-light" type="button" data-demo-url="https://puzz.link/p?mannequin/6/6/6enfpho6m1eel2h">Mannequin Gate</button>
        <button class="button button-light" type="button" data-demo-url="https://swaroopg92.github.io/penpa-edit/?m=edit">Penpa+ 模块</button>
        <button class="button button-light" type="button" data-demo-url="https://pzprxs.vercel.app/p?slither/6/6/">pzprxs 模块</button>
        <button class="button button-light" type="button" data-demo-url="https://evil.example/puzzle">非法来源拦截</button>
      </div>

      <p class="embed-demo-note" id="embedDemoNote">当前测试：<strong>https://puzz.link/p?mannequin/6/6/6enfpho6m1eel2h</strong></p>
      <section id="embedDemoResult" class="embed-demo-result"></section>
    </main>
    <script type="module" src="embed-demo.js"></script>
  </body>
</html>
